name: Build ElytrixBots

on:
  push:
    branches: [arena/01a0ac47-rteuj5er76j]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '16'
          cache: maven
      - name: Build
        shell: bash
        run: |
          set +e
          mvn --batch-mode clean package 2>&1 | tee build.log
          code=${PIPESTATUS[0]}
          if [ "$code" -eq 0 ]; then
            mvn --batch-mode --update-snapshots -f bungee/pom.xml clean package 2>&1 | tee -a build.log
            code=${PIPESTATUS[0]}
          fi
          if [ "$code" -ne 0 ]; then
            grep -E '^\[ERROR\]' build.log | tail -30 | while IFS= read -r line; do echo "::error::$line"; done
            exit "$code"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ElytrixBots
          path: |
            target/ElytrixBots-*.jar
            bungee/target/ElytrixBots-Bungee-*.jar
            build.log
