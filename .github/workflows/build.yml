name: build

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10"
      - name: Build
        run: |
          gradle build --no-daemon --stacktrace > /tmp/build.log 2>&1
          code=$?
          tail -n 60 /tmp/build.log
          exit $code
      - name: Report failure to commit
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tail -c 40000 /tmp/build.log > /tmp/fail.txt
          { echo "## Build failure (run ${{ github.run_id }})"; echo '```'; cat /tmp/fail.txt; echo '```'; } > /tmp/comment.md
          gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/comments" --raw-field body="$(cat /tmp/comment.md)"
      - name: Probe repos
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "## Repo probe (run ${{ github.run_id }})"
            for u in \
              "https://repo.papermc.io/repository/maven-public/io/papermc/paper/paper-api/1.16.5-R0.1-SNAPSHOT/maven-metadata.xml" \
              "https://hub.spigotmc.org/nexus/content/repositories/snapshots/org/spigotmc/spigot-api/1.16.5-R0.1-SNAPSHOT/maven-metadata.xml" ; do
              code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 20 "$u")
              echo "- [$code] $u"
            done
            echo "### paper-api versions (tail)"
            curl -s --max-time 20 "https://repo.papermc.io/repository/maven-public/io/papermc/paper/paper-api/maven-metadata.xml" | grep -o "<version>[^<]*" | tail -5
            echo "### spigot-api versions (tail)"
            curl -s --max-time 20 "https://hub.spigotmc.org/nexus/content/repositories/snapshots/org/spigotmc/spigot-api/maven-metadata.xml" | grep -o "<version>[^<]*" | tail -5
            echo "### packetevents-spigot versions (tail)"
            curl -s --max-time 20 "https://repo.codemc.io/repository/maven-public/net/github/retrooper/packetevents-spigot/maven-metadata.xml" | grep -o "<version>[^<]*" | tail -8
          } > /tmp/probe.md
          cat /tmp/probe.md
          gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/comments" --raw-field body="$(cat /tmp/probe.md)"
      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: ElytrixFuckCheats
          path: build/libs/*.jar
