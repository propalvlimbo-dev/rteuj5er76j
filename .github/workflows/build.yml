name: build

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10"
      - name: Build
        run: |
          gradle build --no-daemon --stacktrace > /tmp/build.log 2>&1
          code=$?
          tail -n 60 /tmp/build.log
          exit $code
      - name: Report failure to commit
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tail -c 40000 /tmp/build.log > /tmp/fail.txt
          { echo "## Build failure (run ${{ github.run_id }})"; echo '```'; cat /tmp/fail.txt; echo '```'; } > /tmp/comment.md
          gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/comments" --raw-field body="$(cat /tmp/comment.md)"
      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: ElytrixFuckCheats
          path: build/libs/*.jar
