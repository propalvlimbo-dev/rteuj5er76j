name: Build ElytrixBots

on:
  push:
    branches: [arena/01a0ac47-rteuj5er76j]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '16'
          cache: maven
      - name: Build
        run: mvn --batch-mode clean package 2>&1 | tee build.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ElytrixBots
          path: |
            target/ElytrixBots-*.jar
            build.log
