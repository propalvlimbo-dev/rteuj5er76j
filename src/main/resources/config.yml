# ElytrixFuckCheats — конфиг
# Правило: любая новая проверка добавляется ВЫКЛЮЧЕННОЙ,
# включается только после тестов на живых игроках.

prefix: "&8[&cEFC&8]"

alerts:
  format: "%prefix% &c%player% &7флагнут &e%check% &7(VL: &c%vl%&7) &8%details%"
  console: true

# На сколько VL в секунду "отмывается" игрок.
vl-decay-per-second: 1.0

grace:
  join-seconds: 5
  teleport-seconds: 3

# Ниже этого TPS проверки не работают — лаги сервера не вина игрока.
min-tps: 18.5

# Креатив и спектатор не проверяются.
creative-bypass: true

# Пауза между наказаниями одного игрока по одной проверке.
punish-cooldown-seconds: 60

# Проверки. add-vl — сколько VL даёт один флаг, max-vl — порог наказания.
checks:
  killaura-a:
    enabled: true
    add-vl: 2.0
    max-vl: 16.0
    snap-degrees: 150.0
  reach-a:
    enabled: true
    add-vl: 1.0
    max-vl: 25.0
    max-reach: 3.6
  autoclicker-a:
    enabled: true
    add-vl: 2.0
    max-vl: 30.0
    max-cps: 20
    max-stddev-ms: 10.0
  fly-a:
    enabled: true
    add-vl: 2.0
    max-vl: 40.0
  speed-a:
    enabled: true
    add-vl: 1.0
    max-vl: 30.0
    max-bps: 9.5
  killaura-b:
    enabled: true
    add-vl: 2.0
    max-vl: 16.0
  killaura-c:
    enabled: true
    add-vl: 1.0
    max-vl: 20.0
  reach-b:
    enabled: true
    add-vl: 2.0
    max-vl: 20.0
    avg-reach: 3.1
  autoclicker-b:
    enabled: true
    add-vl: 3.0
    max-vl: 30.0
    blatant-cps: 30
  aim-a:
    enabled: true
    add-vl: 2.0
    max-vl: 20.0
  aim-b:
    enabled: true
    add-vl: 2.0
    max-vl: 20.0
  aim-c:
    enabled: true
    add-vl: 2.0
    max-vl: 12.0
    max-angle: 100.0
  accuracy-a:
    enabled: true
    add-vl: 1.0
    max-vl: 20.0
  velocity-a:
    enabled: true
    add-vl: 3.0
    max-vl: 24.0
  fastbow-a:
    enabled: true
    add-vl: 2.0
    max-vl: 16.0
  fasteat-a:
    enabled: true
    add-vl: 2.0
    max-vl: 16.0

punishments:
  # Команды консоли. Плейсхолдеры: %player% %check% %vl%
  default:
    - "kick %player% Elytrix: читы запрещены (%check%)"
