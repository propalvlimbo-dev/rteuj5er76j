# ElytrixFuckCheats — конфиг
# Правило: любая новая проверка добавляется ВЫКЛЮЧЕННОЙ,
# включается только после тестов на живых игроках.

prefix: "&8[&cEFC&8]"

alerts:
  format: "%prefix% &c%player% &7флагнут &e%check% &7(VL: &c%vl%&7) &8%details%"
  console: true

# На сколько VL в секунду "отмывается" игрок.
vl-decay-per-second: 1.0

grace:
  join-seconds: 5
  teleport-seconds: 3

# Ниже этого TPS проверки не работают — лаги сервера не вина игрока.
min-tps: 18.5

# Креатив и спектатор не проверяются.
creative-bypass: true

# Пауза между наказаниями одного игрока по одной проверке.
punish-cooldown-seconds: 60

# Проверки. add-vl — сколько VL даёт один флаг, max-vl — порог наказания.
checks:
  killaura-a:
    enabled: true
    add-vl: 2.0
    max-vl: 16.0
    snap-degrees: 200.0
    hit-window-ms: 120.0
  reach-a:
    enabled: true
    add-vl: 1.0
    max-vl: 25.0
    base: 3.03
    per-ms: 0.0022
    cap: 3.75
  autoclicker-a:
    enabled: true
    add-vl: 2.0
    max-vl: 30.0
    max-cps: 20
    max-stddev-ms: 10.0
  fly-a:
    enabled: true
    add-vl: 2.0
    max-vl: 40.0
  speed-a:
    enabled: true
    add-vl: 1.0
    max-vl: 30.0
    max-bps: 9.5
  # ВЫКЛЮЧЕНА: новые клиенты не шлют взмах при ударе, форки едят событие.
  # Вернётся с пакетным слоем (проверка версии клиента).
  killaura-b:
    enabled: false
    add-vl: 2.0
    max-vl: 16.0
  killaura-c:
    enabled: true
    add-vl: 1.0
    max-vl: 20.0
  killaura-d:
    enabled: true
    add-vl: 2.0
    max-vl: 6.0
  killaura-e:
    enabled: true
    add-vl: 2.0
    max-vl: 8.0
    max-precision: 17.0
  killaura-f:
    enabled: true
    add-vl: 2.0
    max-vl: 8.0
  reach-b:
    enabled: true
    add-vl: 2.0
    max-vl: 20.0
    base: 3.0
    per-ms: 0.0025
    cap: 4.0
  autoclicker-b:
    enabled: true
    add-vl: 3.0
    max-vl: 30.0
    blatant-cps: 30
  autoclicker-c:
    enabled: true
    add-vl: 2.0
    max-vl: 30.0
    max-cps: 18
  autoclicker-d:
    enabled: true
    add-vl: 2.0
    max-vl: 30.0
    max-cps: 16
  # ВЫКЛЮЧЕНА: GCD-модуло флагает современные мыши (8К опрос, акселерация).
  # Вернётся с пакетным слоем (предсказание как у Grim).
  aim-a:
    enabled: false
    add-vl: 1.0
    max-vl: 6.0
  # ВЫКЛЮЧЕНА: та же причина — GCD питча нестабилен на современном железе.
  aim-b:
    enabled: false
    add-vl: 1.0
    max-vl: 10.0
  aim-c:
    enabled: true
    add-vl: 2.0
    max-vl: 12.0
    base-expand: 0.3
    per-ms: 0.004
    cap-expand: 1.2
  aim-d:
    enabled: true
    add-vl: 2.0
    max-vl: 8.0
  aim-e:
    enabled: true
    add-vl: 2.0
    max-vl: 10.0
  accuracy-a:
    enabled: true
    add-vl: 1.0
    max-vl: 20.0
  criticals-a:
    enabled: true
    add-vl: 1.0
    max-vl: 8.0
  velocity-a:
    enabled: true
    add-vl: 3.0
    max-vl: 24.0
  fastbow-a:
    enabled: true
    add-vl: 2.0
    max-vl: 16.0
  fasteat-a:
    enabled: true
    add-vl: 2.0
    max-vl: 16.0

punishments:
  # Команды консоли. Плейсхолдеры: %player% %check% %vl%
  default:
    - "kick %player% Elytrix: читы запрещены (%check%)"
