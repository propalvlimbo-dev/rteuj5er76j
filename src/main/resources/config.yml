proxy-sync:
  enabled: true
  host: 127.0.0.1
  port: 29175
  secret: change-me
  interval-seconds: 3

formatting:
  # Используется, если у LuckPerms-группы нет suffix.
  default-suffix: " &#F8BEFBБЕТА"

settings:
  movement-period-ticks: 2
  motd-count-enabled: true
  use-essentials-spawn: true
  physics:
    enabled: true
    max-step-height: 1
    max-fall-check: 4
