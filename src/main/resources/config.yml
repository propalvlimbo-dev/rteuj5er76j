# ElytrixFuckCheats — конфиг
# Правило: любая новая проверка добавляется ВЫКЛЮЧЕННОЙ,
# включается только после тестов на живых игроках.

prefix: "&8[&cEFC&8]"

alerts:
  format: "%prefix% &c%player% &7флагнут &e%check% &7(VL: &c%vl%&7) &8%details%"
  console: true

# На сколько VL в секунду "отмывается" игрок.
vl-decay-per-second: 1.0

grace:
  join-seconds: 5
  teleport-seconds: 3

# Ниже этого TPS проверки не работают — лаги сервера не вина игрока.
min-tps: 18.5

# Креатив и спектатор не проверяются.
creative-bypass: true

# Пауза между наказаниями одного игрока по одной проверке.
punish-cooldown-seconds: 15

# Проверки. add-vl — сколько VL даёт один флаг, max-vl — порог наказания.
checks:
  killaura-a:
    enabled: true
    add-vl: 3.0
    max-vl: 9.0
    snap-degrees: 200.0
    hit-window-ms: 120.0
  killaura-b:
    enabled: true
    add-vl: 2.0
    max-vl: 8.0
  killaura-c:
    enabled: true
    add-vl: 1.0
    max-vl: 20.0
  killaura-d:
    enabled: true
    add-vl: 2.0
    max-vl: 6.0
  killaura-e:
    enabled: false
    add-vl: 2.0
    max-vl: 8.0
    max-precision: 17.0
  killaura-f:
    enabled: true
    add-vl: 2.0
    max-vl: 8.0
  killaura-g:
    enabled: true
    add-vl: 1.0
    max-vl: 6.0
    max-stddev-ms: 12.0
  aim-a:
    enabled: false
    add-vl: 1.0
    max-vl: 6.0
  aim-b:
    enabled: false
    add-vl: 1.0
    max-vl: 10.0
  aim-c:
    enabled: true
    add-vl: 2.0
    max-vl: 12.0
    base-expand: 0.3
    per-ms: 0.004
    cap-expand: 1.2
  aim-d:
    enabled: true
    add-vl: 2.0
    max-vl: 8.0
  aim-e:
    enabled: true
    add-vl: 2.0
    max-vl: 10.0
  aim-f:
    enabled: true
    add-vl: 3.0
    max-vl: 10.0

punishments:
