# Continue (расширение VS Code / JetBrains) — конфиг под FreeCoder Router + SmartAPI.
# Куда положить: ~/.continue/config.yaml  (Windows: C:\Users\<вы>\.continue\config.yaml)
#
# Ключ SmartAPI здесь не нужен: его читает роутер из переменной окружения SMARTAPI_KEY.
# Continue видит модель "FreeCoder auto", а роутер сам решает, куда отправить запрос:
#   auto  — SmartAPI Sonnet 4.6 (×2), при обрыве бесплатные модели и локальная Ollama
#   smart — SmartAPI Opus 4.8 (×4) для сложных задач
#   cheap — самая экономичная платная модель (автодополнение)
#   local — только Ollama, офлайн и без лимитов
#
# Важно: перед работой запустите windows\START-SMARTAPI.bat (окно роутера не закрывать).

name: FreeCoder
version: 1.0.0
schema: v1

models:
  - name: FreeCoder auto (Sonnet 4.6)
    provider: openai
    model: auto
    apiBase: http://127.0.0.1:8788/v1
    apiKey: freecoder
    roles:
      - chat
      - edit
      - apply

  - name: FreeCoder smart (Opus 4.8, ×4)
    provider: openai
    model: smart
    apiBase: http://127.0.0.1:8788/v1
    apiKey: freecoder
    roles:
      - chat

  - name: FreeCoder cheap (экономия)
    provider: openai
    model: cheap
    apiBase: http://127.0.0.1:8788/v1
    apiKey: freecoder
    roles:
      - autocomplete

  - name: FreeCoder local (офлайн, без лимитов)
    provider: openai
    model: local
    apiBase: http://127.0.0.1:8788/v1
    apiKey: freecoder
    roles:
      - chat

context:
  - provider: file
  - provider: code
  - provider: diff
  - provider: terminal
  - provider: problems

rules:
  - "Отвечай по-русски."
  - "Перед правкой прочитай файл целиком, не выдумывай содержимое."
  - "Для больших файлов делай точечные замены, а не перезапись целиком."
